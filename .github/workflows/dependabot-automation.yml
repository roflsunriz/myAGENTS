name: Dependabot automation

on:
  workflow_call:
    inputs:
      ci_workflows:
        description: JSON array of PR CI workflow display names that must pass
        required: true
        type: string
      post_merge_workflows:
        description: JSON array of workflow filenames to dispatch after merge
        required: false
        default: '[]'
        type: string
      autofix_command:
        description: Trusted command for deterministic lockfile or generated-file repair
        required: false
        default: ''
        type: string
      autofix_paths:
        description: JSON array of exact paths the repair is allowed to commit
        required: false
        default: '[]'
        type: string
      autofix_workflow_files:
        description: JSON array of CI workflow filenames to dispatch after a repair push
        required: false
        default: '[]'
        type: string

jobs:
  classify:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      - name: Mark patch or minor update eligible
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_SHA" \
            -f state=success \
            -f context=dependabot/auto-merge-eligible \
            -f description='Verified Dependabot patch or minor update' >/dev/null

  process-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Retry once or merge verified update
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_WORKFLOWS: ${{ inputs.ci_workflows }}
          POST_MERGE_WORKFLOWS: ${{ inputs.post_merge_workflows }}
        run: |
          set -euo pipefail

          owner=${GITHUB_REPOSITORY%%/*}
          prs_json=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=$owner:$RUN_BRANCH")
          mapfile -t prs < <(jq -r --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$RUN_SHA" \
            '.[] | select(.user.login == "dependabot[bot]" and .head.repo.full_name == $repo and .head.sha == $sha) | .number' \
            <<< "$prs_json")
          if [ "${#prs[@]}" -ne 1 ]; then
            echo 'No unique current Dependabot PR for this CI run.'
            exit 0
          fi
          pr=${prs[0]}

          if [ "$RUN_CONCLUSION" = failure ]; then
            if [ "$RUN_ATTEMPT" = 1 ]; then
              gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
            else
              echo 'CI failed again; leaving the pull request open for repair.'
            fi
            exit 0
          fi

          policy=
          for attempt in 1 2 3 4 5; do
            policy=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_SHA/status" \
              --jq '[.statuses[] | select(.context == "dependabot/auto-merge-eligible")][0].state // ""')
            [ "$policy" = success ] && break
            sleep 10
          done
          if [ "$policy" != success ]; then
            echo 'This commit has no verified patch/minor eligibility status.'
            exit 0
          fi

          checks=$(gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" \
            --json name,bucket,workflow)
          if ! jq -e --argjson names "$CI_WORKFLOWS" '
            . as $checks |
            all($names[]; . as $name |
              any($checks[]; .workflow == $name and .bucket == "pass")) and
            all($checks[]; .bucket == "pass" or .bucket == "skipping")
          ' <<< "$checks" >/dev/null; then
            echo 'One or more expected PR CI checks are missing, pending, or failed.'
            exit 0
          fi

          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$RUN_SHA"

          while IFS= read -r workflow; do
            [ -z "$workflow" ] && continue
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME"
          done < <(jq -r '.[]' <<< "$POST_MERGE_WORKFLOWS")

  prepare-autofix:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt > 1 &&
      contains(fromJSON(inputs.ci_workflows), github.event.workflow_run.name) &&
      inputs.autofix_command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify current Dependabot PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%%/*}
          prs_json=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=$owner:$RUN_BRANCH")
          count=$(jq --arg repo "$GITHUB_REPOSITORY" --arg sha "$RUN_SHA" \
            '[.[] | select(.user.login == "dependabot[bot]" and .head.repo.full_name == $repo and .head.sha == $sha)] | length' \
            <<< "$prs_json")
          [ "$count" = 1 ] || exit 1
          message=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_SHA" \
            --jq '.commit.message')
          if [[ "$message" == *'[dependabot-autofix]'* ]]; then
            echo 'A deterministic repair was already attempted for this PR.'
            exit 1
          fi
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out failed Dependabot commit without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Set up Bun for supported lockfile repair
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Run deterministic repair with read-only token
        env:
          AUTOFIX_COMMAND: ${{ inputs.autofix_command }}
          AUTOFIX_PATHS: ${{ inputs.autofix_paths }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$AUTOFIX_COMMAND"
          mapfile -t paths < <(jq -r '.[]' <<< "$AUTOFIX_PATHS")
          [ "${#paths[@]}" -gt 0 ] || exit 1
          git add -- "${paths[@]}"
          git diff --cached --binary > "$RUNNER_TEMP/dependabot-autofix.patch"

      - name: Upload repair patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependabot-autofix
          path: ${{ runner.temp }}/dependabot-autofix.patch
          if-no-files-found: error
          retention-days: 1

  apply-autofix:
    needs: prepare-autofix
    if: needs.prepare-autofix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - name: Check out failed commit without saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download isolated repair patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependabot-autofix
          path: ${{ runner.temp }}/dependabot-autofix

      - name: Validate, apply, and retest repaired files
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTOFIX_PATHS: ${{ inputs.autofix_paths }}
          AUTOFIX_WORKFLOWS: ${{ inputs.autofix_workflow_files }}
          CI_WORKFLOWS: ${{ inputs.ci_workflows }}
          POST_MERGE_WORKFLOWS: ${{ inputs.post_merge_workflows }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/dependabot-autofix/dependabot-autofix.patch"
          [ -s "$patch" ] || { echo 'No safe repair diff.'; exit 0; }
          mapfile -t paths < <(jq -r '.[]' <<< "$AUTOFIX_PATHS")
          [ "${#paths[@]}" -gt 0 ] || exit 1
          include=()
          for path in "${paths[@]}"; do
            [[ "$path" != /* && "$path" != *'..'* && "$path" != *'*'* ]] || exit 1
            include+=("--include=$path")
          done
          git apply --check "${include[@]}" "$patch"
          git apply "${include[@]}" "$patch"
          git add -- "${paths[@]}"
          mapfile -d '' -t changed < <(git diff --cached --name-only -z)
          [ "${#changed[@]}" -gt 0 ] || exit 0
          for path in "${changed[@]}"; do
            jq -e --arg path "$path" 'index($path) != null' \
              <<< "$AUTOFIX_PATHS" >/dev/null || exit 1
            mode=$(git ls-files --stage -- "$path" | cut -d' ' -f1)
            [ "$mode" = 100644 ] || exit 1
          done
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RUN_BRANCH" \
            --jq '.object.sha')
          [ "$remote_sha" = "$RUN_SHA" ] || { echo 'PR changed during repair.'; exit 0; }

          policy=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_SHA/status" \
            --jq '[.statuses[] | select(.context == "dependabot/auto-merge-eligible")][0].state // ""')
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fix(deps): Dependabot更新の生成物を再作成 [dependabot-autofix]'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$RUN_BRANCH"
          new_sha=$(git rev-parse HEAD)
          if [ "$policy" = success ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$new_sha" \
              -f state=success -f context=dependabot/auto-merge-eligible \
              -f description='Verified update with restricted generated-file repair' >/dev/null
          fi

          # A GITHUB_TOKEN dispatch can start CI without emitting another
          # workflow_run event. Wait for the returned run IDs in this job.
          while IFS= read -r workflow; do
            [ -z "$workflow" ] && continue
            dispatched=$(gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -f "ref=$RUN_BRANCH" -F return_run_details=true)
            run_id=$(jq -er '.workflow_run_id' <<< "$dispatched")
            completed=false
            for attempt in $(seq 1 120); do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
              run_sha=$(jq -r '.head_sha' <<< "$run")
              [ "$run_sha" = "$new_sha" ] || exit 1
              if [ "$(jq -r '.status' <<< "$run")" = completed ]; then
                completed=true
                [ "$(jq -r '.conclusion' <<< "$run")" = success ] || {
                  echo "Repaired CI failed: $workflow ($run_id)"
                  exit 0
                }
                break
              fi
              sleep 15
            done
            [ "$completed" = true ] || {
              echo "Repaired CI timed out: $workflow ($run_id)"
              exit 1
            }
          done < <(jq -r '.[]' <<< "$AUTOFIX_WORKFLOWS")

          if [ "$policy" != success ]; then
            echo 'Major or otherwise unqualified update remains for review.'
            exit 0
          fi
          owner=${GITHUB_REPOSITORY%%/*}
          prs_json=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=$owner:$RUN_BRANCH")
          pr=$(jq -er --arg repo "$GITHUB_REPOSITORY" --arg sha "$new_sha" \
            '[.[] | select(.user.login == "dependabot[bot]" and .head.repo.full_name == $repo and .head.sha == $sha)] | if length == 1 then .[0].number else empty end' \
            <<< "$prs_json")
          checks=$(gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" \
            --json name,bucket,workflow)
          if ! jq -e --argjson names "$CI_WORKFLOWS" '
            . as $checks |
            all($names[]; . as $name |
              any($checks[]; .workflow == $name and .bucket == "pass")) and
            all($checks[]; .bucket == "pass" or .bucket == "skipping")
          ' <<< "$checks" >/dev/null; then
            echo 'The repaired commit still has missing or failing checks.'
            exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$new_sha"
          while IFS= read -r workflow; do
            [ -z "$workflow" ] && continue
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME"
          done < <(jq -r '.[]' <<< "$POST_MERGE_WORKFLOWS")
